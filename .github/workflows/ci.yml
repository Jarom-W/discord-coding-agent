name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; node24
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7; node24
        with:
          version: '0.12.10'
          enable-cache: false
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -q
      # The test suite runs systemd-analyze on generated units, without installing a service.
      - run: uv build
      - name: Check runtime lock export
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.lock > /dev/null
          diff -u <(tail -n +3 requirements.lock) <(tail -n +3 /tmp/requirements.lock)
      - name: Install and smoke test wheel
        run: |
          python -m venv /tmp/dca-wheel
          /tmp/dca-wheel/bin/python -m pip install --require-hashes -r requirements.lock
          /tmp/dca-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/dca-wheel/bin/discord-coding-agent --version
          /tmp/dca-wheel/bin/discord-coding-agent --help
