name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          enable-cache: false
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -q
      # The test suite runs systemd-analyze on generated units, without installing a service.
      - run: uv build
      - name: Check runtime lock export
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.lock > /dev/null
          diff -u <(tail -n +3 requirements.lock) <(tail -n +3 /tmp/requirements.lock)
      - name: Install and smoke test wheel
        run: |
          python -m venv /tmp/dca-wheel
          /tmp/dca-wheel/bin/python -m pip install --require-hashes -r requirements.lock
          /tmp/dca-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/dca-wheel/bin/discord-coding-agent --version
          /tmp/dca-wheel/bin/discord-coding-agent --help
